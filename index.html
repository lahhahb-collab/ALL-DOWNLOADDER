<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XCY DOWNLOADER - Universal Media Downloader</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f3f4f8;
      color: #111;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      padding-bottom: 40px;
    }

    .header {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 0 20px;
    }

    .input-box {
      background: #ffffff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      padding: 6px 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      margin-bottom: 15px;
    }

    .input-box input {
      border: none;
      outline: none;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      background: transparent;
    }

    .input-box .icon-btn {
      background: none;
      border: none;
      color: #555;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 8px;
    }

    .btn-analyze {
      width: 100%;
      background-color: #111111;
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 25px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn-analyze:hover {
      background-color: #333333;
    }

    .btn-analyze:disabled {
      background-color: #888888;
      cursor: not-allowed;
    }

    .toast {
      visibility: hidden;
      min-width: 280px;
      background-color: #111;
      color: #fff;
      text-align: center;
      border-radius: 12px;
      padding: 14px;
      position: fixed;
      z-index: 1000;
      bottom: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      opacity: 0;
      transition: opacity 0.3s, bottom 0.3s;
    }

    .toast.show {
      visibility: visible;
      opacity: 1;
      bottom: 40px;
    }

    .section-title {
      text-align: center;
      margin: 35px 0 20px 0;
      font-size: 0.75rem;
      font-weight: 700;
      color: #777;
      letter-spacing: 1px;
    }

    .platforms-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .platform-card {
      background: #ffffff;
      padding: 14px 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .platform-card i, .platform-card svg {
      font-size: 1.2rem;
      width: 20px;
      height: 20px;
      text-align: center;
      fill: currentColor;
    }

    #result {
      margin-top: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      display: none;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    #result video, #result img {
      width: 100%;
      max-height: 350px;
      border-radius: 12px;
      margin-bottom: 12px;
      object-fit: contain;
      background: #000;
    }

    .dl-btn {
      display: block;
      width: 100%;
      background: #111;
      color: white;
      padding: 14px 20px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    .dl-btn:hover {
      background: #333;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>XCY DOWNLOADER</h1>
  </div>

  <div class="container">
    <div class="input-box">
      <input type="text" id="urlInput" placeholder="Paste link here...">
      <button class="icon-btn" onclick="pasteClipboard()"><i class="fa-regular fa-clipboard"></i></button>
    </div>

    <button class="btn-analyze" id="analyzeBtn" onclick="analyzeUrl()">ANALYZE</button>

    <div id="result"></div>

    <div class="section-title">SUPPORTED PLATFORMS</div>

    <div class="platforms-grid">

      <div class="platform-card"><i class="fa-brands fa-youtube"></i> YOUTUBE</div>
      <div class="platform-card"><i class="fa-brands fa-x-twitter"></i> TWITTER</div>
      <div class="platform-card"><i class="fa-brands fa-spotify"></i> SPOTIFY</div>
      <div class="platform-card"><i class="fa-solid fa-tv"></i> BILIBILI</div>
      <div class="platform-card"><i class="fa-solid fa-bold"></i> DOUYIN</div>
      <div class="platform-card"><i class="fa-solid fa-book-open"></i> REDNOTE</div>
      
      <div class="platform-card">

        THREADS
      </div>

      <div class="platform-card"><i class="fa-brands fa-pinterest"></i> PINTEREST</div>
      <div class="platform-card"><i class="fa-brands fa-apple"></i> APPLE MUSIC</div>
      <div class="platform-card"><i class="fa-brands fa-facebook"></i> FACEBOOK</div>
      <div class="platform-card"><i class="fa-brands fa-bandcamp"></i> BANDCAMP</div>
      <div class="platform-card"><i class="fa-solid fa-p"></i> PIXIV</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      toast.className = "toast show";
      setTimeout(function(){ 
        toast.className = toast.className.replace("toast show", "toast"); 
      }, 3000);
    }

    async function pasteClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('urlInput').value = text;
        showToast('Link berhasil ditempel!');
      } catch (err) {
        showToast('Gagal membaca clipboard');
      }
    }

    async function triggerDirectDownload(fileUrl, filename) {
      if (!fileUrl) return;
      showToast('Mengunduh file...');
      try {
        const response = await fetch(fileUrl);
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(blobUrl);
        showToast('Download Selesai!');
      } catch (error) {
        window.open(fileUrl, '_blank');
      }
    }

    async function analyzeUrl() {
      const url = document.getElementById('urlInput').value.trim();
      const btn = document.getElementById('analyzeBtn');
      const resultDiv = document.getElementById('result');

      if (!url) {
        showToast('Masukkan URL terlebih dahulu!');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'PROCESSING...';
      resultDiv.style.display = 'none';

      try {
        const response = await fetch('/api/backend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        if (data.success) {
          resultDiv.style.display = 'block';

          const mainVideo = data.noWmUrl || data.wmUrl;
          let mediaHtml = '';
          if (mainVideo) {
            mediaHtml = `<video controls playsinline src="${mainVideo}"></video>`;
          } else if (data.cover) {
            mediaHtml = `<img src="${data.cover}" alt="Cover">`;
          }

          resultDiv.innerHTML = `
            ${mediaHtml}
            <h3 style="font-size:0.95rem; font-weight:700; margin-bottom:12px;">${data.title}</h3>
            ${data.noWmUrl ? `<button onclick="triggerDirectDownload('${data.noWmUrl}', 'XCY_NoWatermark.mp4')" class="dl-btn" style="background:#25d366">DOWNLOAD NO WATERMARK</button>` : ''}
            ${data.wmUrl ? `<button onclick="triggerDirectDownload('${data.wmUrl}', 'XCY_Watermark.mp4')" class="dl-btn">DOWNLOAD WATERMARK</button>` : ''}
            ${data.musicUrl ? `<button onclick="triggerDirectDownload('${data.musicUrl}', 'XCY_Audio.mp3')" class="dl-btn" style="background:#007bff">DOWNLOAD AUDIO (MP3)</button>` : ''}
          `;
          showToast('Media berhasil diproses!');
        } else {
          showToast(data.message || 'Gagal memproses link.');
        }
      } catch (error) {
        showToast('Terjadi kesalahan jaringan/server.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'ANALYZE';
      }
    }
  </script>
</body>
</html>
